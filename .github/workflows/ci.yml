# Typechecks and tests every push and pull request, then builds both images. Pushes to
# master (and v* tags) publish them to Docker Hub as <user>/chessbuddy-web and
# <user>/chessbuddy-engine; pull requests only check that they build.
# Needs the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret
# (Settings → Secrets and variables → Actions). See docs/deploy-aca.html, step 3.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    name: Image ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chessbuddy-web
            context: .
            file: Dockerfile
          - image: chessbuddy-engine
            context: docker
            file: docker/mcp-stockfish.Dockerfile
            target: http
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check Docker Hub settings
        if: env.PUSH == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Pull requests from forks don't see the variable; the name only matters when pushing.
          images: docker.io/${{ vars.DOCKERHUB_USERNAME || 'chessbuddy' }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # Container Apps runs linux/amd64. Without a provenance attestation the tag
          # is a plain single-platform image.
          platforms: linux/amd64
          provenance: false
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: List the pushed tags
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.image }}"
            printf '%s\n' "$TAGS" | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
